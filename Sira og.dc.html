      </div>
      <div>
        <p style="font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:38px;margin:0;letter-spacing:-.02em">48 h</p>

      <div>

        <p style="font-size:17px;color:#9aa3a8;margin:4px 0 0">sin compromiso</p>
      </div>
    </div>
    <p style="font-family:'IBM Plex Mono',monospace;font-size:17px;letter-spacing:.1em;color:#6f767c;margin:0;white-space:nowrap">sira.ai</p>
